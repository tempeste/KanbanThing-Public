services:
  # ── Convex backend (self-hosted) ───────────────────────────────────
  convex-backend:
    image: ghcr.io/get-convex/convex-backend:latest
    stop_grace_period: 10s
    stop_signal: SIGINT
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3210:3210"
      - "3211:3211"
    volumes:
      - convex_data:/convex/data
    environment:
      - CONVEX_CLOUD_ORIGIN=http://convex-backend:3210
      - CONVEX_SITE_ORIGIN=http://convex-backend:3211
      - RUST_LOG=${RUST_LOG:-info}
      - DOCUMENT_RETENTION_DELAY=${DOCUMENT_RETENTION_DELAY:-172800}
      - APPLICATION_MAX_CONCURRENT_MUTATIONS=${APPLICATION_MAX_CONCURRENT_MUTATIONS:-16}
      - APPLICATION_MAX_CONCURRENT_NODE_ACTIONS=${APPLICATION_MAX_CONCURRENT_NODE_ACTIONS:-16}
      - APPLICATION_MAX_CONCURRENT_QUERIES=${APPLICATION_MAX_CONCURRENT_QUERIES:-16}
      - APPLICATION_MAX_CONCURRENT_V8_ACTIONS=${APPLICATION_MAX_CONCURRENT_V8_ACTIONS:-16}
    healthcheck:
      test: curl -f http://localhost:3210/version
      interval: 5s
      start_period: 10s

  # ── Convex dashboard ───────────────────────────────────────────────
  convex-dashboard:
    image: ghcr.io/get-convex/convex-dashboard:latest
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      - "6791:6791"
    environment:
      - NEXT_PUBLIC_DEPLOYMENT_URL=http://convex-backend:3210
    depends_on:
      convex-backend:
        condition: service_healthy

  # ── kanbanThing (Next.js frontend) ─────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3219:3219"
    environment:
      - NEXT_PUBLIC_CONVEX_URL=http://localhost:3210
      - NEXT_PUBLIC_CONVEX_SITE_URL=http://localhost:3211
      - CONVEX_URL=http://convex-backend:3210
      - CONVEX_SITE_URL=http://convex-backend:3211
    depends_on:
      convex-backend:
        condition: service_healthy

volumes:
  convex_data:
